# Settings shared by every site. The sites themselves are one file per host name in ../sites/ (written by scripts/render_sites.py), so adding or removing a host never touches the others.
# Upstream names are looked up when a request arrives (Docker's resolver): the edge starts even before an app is deployed, and an app restart is picked up.
resolver 127.0.0.11 valid=10s ipv6=off;
gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

map $http_upgrade $connection_upgrade {      # WebSocket support for any app
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    # Let's Encrypt asks here (HTTP-01) whether this server controls the host name: the certbot container writes the answer into this folder
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# a host name that has no site is refused during the TLS handshake (no certificate is shown)
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

include /etc/nginx/sites/*.conf;
