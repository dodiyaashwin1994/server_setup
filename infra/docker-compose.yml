name: infra

# Shared services of the server: the nginx edge (HTTPS, one site file per host name), certbot (free Let's Encrypt certificates, requested by `nginx-route add` and renewed here), MySQL, Redis and RabbitMQ.
# Applications reach MySQL, Redis and RabbitMQ over the docker network `public`. The published ports below are for tools on the server (or an SSH tunnel): they listen on 127.0.0.1
# unless the Setup infrastructure workflow was given another bind address. NOTE: a published port is open to whoever can reach that address, ufw does not filter it (docker bypasses it).
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/sites:/etc/nginx/sites:ro
      - ./certs:/etc/nginx/certs:ro                 # certificates a service brought as files (optional)
      - ./letsencrypt:/etc/letsencrypt:ro           # Let's Encrypt certificates (certbot writes them)
      - ./acme-webroot:/var/www/certbot:ro          # where Let's Encrypt's challenge answers are served from
    # nginx reads certificates when it starts: reload now and then so a renewed one is picked up
    command: ["/bin/sh", "-c", "(while :; do sleep 6h; nginx -s reload; done) & exec nginx -g 'daemon off;'"]
    networks:
      - public
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:v3.0.1
    container_name: certbot
    restart: unless-stopped
    # renews every certificate that is due (Let's Encrypt certificates last 90 days; certbot renews from 30 days before the end). New ones are requested by nginx-route.
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./acme-webroot:/var/www/certbot
    networks:
      - public

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"          # the port tools outside the server use (3306 inside); open only when mysql_remote_ips is set
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      public:
        aliases:
          - mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      public:
        aliases:
          - redis

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:5672:5672"
      - "127.0.0.1:15672:15672"            # the management page: this machine only
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      public:
        aliases:
          - rabbitmq

networks:
  public:
    external: true

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
