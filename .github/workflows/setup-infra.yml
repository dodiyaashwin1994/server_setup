name: Setup infrastructure

# Installs the shared part of a server, once: Docker, a firewall that opens SSH / HTTP / HTTPS, the nginx edge, MySQL, Redis and RabbitMQ, and the `nginx-route` command.
# Run it for a new server, or again to change a password or a bind address (the host files and certificates the services have put on the server are kept; the services of your applications are not touched; MySQL's root password is only set on the very first start, see the README).
# Each service then publishes its own address when it is deployed (see its deploy workflow); this workflow knows no app. HTTPS certificates are free Let's Encrypt ones: `nginx-route add`
# requests one for every host name the first time it is published (the name must point to this server and port 80 must be reachable), and the certbot container renews them.

#
# Everything is asked here, as inputs of the run: nothing is read from secrets or variables of this repository, except the SSH private key (the secret SSH_PRIVATE_KEY of the
# environment; the branch picks it: main, dev, uat). The typed passwords are masked in the logs, but stay visible in the run's inputs to everyone who can read this repository's runs.
on:
  workflow_dispatch:
    inputs:
      server_host:
        description: IP address (or host name) of the server to set up
        type: string
        required: true
      ssh_user:
        description: SSH user
        type: string
        default: root
      ssh_port:
        description: SSH port
        type: string
        default: "22"
      infra_root:
        description: Folder of the shared services on the server (the services of the applications go to /opt/saas, see their deploy workflows)
        type: string
        default: /opt/infra
      mysql_username:
        description: "MySQL user the services log in with (root, or another user that is created with every privilege)"
        type: string
        default: root
      mysql_password:
        description: MySQL password of that user (also the password of root)
        type: string
        required: true
      mysql_bind_address:
        description: "Address MySQL's published port listens on. Not needed: 127.0.0.1 (this machine only) is enough, apps use the docker network"
        type: string
        default: 127.0.0.1
      redis_password:
        description: Redis password
        type: string
        required: true
      redis_bind_address:
        description: "Address Redis's published port listens on (127.0.0.1 = this machine only)"
        type: string
        default: 127.0.0.1
      rabbitmq_username:
        description: RabbitMQ user
        type: string
        default: root
      rabbitmq_password:
        description: RabbitMQ password
        type: string
        required: true
      rabbitmq_bind_address:
        description: "Address RabbitMQ's published port listens on (127.0.0.1 = this machine only)"
        type: string
        default: 127.0.0.1
      acme_email:
        description: "E-mail address for Let's Encrypt (it writes to it before a certificate expires)"
        type: string
        required: true
      acme_staging:
        description: "Use Let's Encrypt's test service (certificates browsers do not trust, no rate limits): to try the first deploys. Leave off for real use"
        type: boolean
        default: false
      rabbitmq_domain:
        description: "Host name of the RabbitMQ management page, e.g. rabbitmq.example.com (empty = not published). Needs a certificate: see the README"
        type: string
        required: false
      rabbitmq_allowed_ips:
        description: "Addresses allowed to open that page, comma separated, e.g. 203.0.113.0/24,198.51.100.7 (empty = everyone who knows the login)"
        type: string
        required: false

concurrency:
  group: infra-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      HOST: ${{ inputs.server_host }}
      USER: ${{ inputs.ssh_user }}
      PORT: ${{ inputs.ssh_port }}
      INFRA_ROOT: ${{ inputs.infra_root }}
      MYSQL_USERNAME: ${{ inputs.mysql_username }}
      MYSQL_PASSWORD: ${{ inputs.mysql_password }}
      MYSQL_BIND_ADDRESS: ${{ inputs.mysql_bind_address }}
      REDIS_PASSWORD: ${{ inputs.redis_password }}
      REDIS_BIND_ADDRESS: ${{ inputs.redis_bind_address }}
      RABBITMQ_USERNAME: ${{ inputs.rabbitmq_username }}
      RABBITMQ_PASSWORD: ${{ inputs.rabbitmq_password }}
      RABBITMQ_BIND_ADDRESS: ${{ inputs.rabbitmq_bind_address }}
      ACME_EMAIL: ${{ inputs.acme_email }}
      ACME_STAGING: ${{ inputs.acme_staging }}
      RABBITMQ_DOMAIN: ${{ inputs.rabbitmq_domain }}
      RABBITMQ_ALLOWED_IPS: ${{ inputs.rabbitmq_allowed_ips }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the values
        run: |
          # keep typed passwords out of the logs
          for v in MYSQL_PASSWORD REDIS_PASSWORD RABBITMQ_PASSWORD; do [ -n "${!v}" ] && echo "::add-mask::${!v}"; done
          [ -n "$HOST" ] || { echo "::error::Give the server's IP address (input server_host)."; exit 1; }
          for v in MYSQL_PASSWORD REDIS_PASSWORD RABBITMQ_PASSWORD; do [ -n "${!v}" ] || { echo "::error::$v is empty: type it as an input of the run."; exit 1; }; done
          [[ "$MYSQL_USERNAME" =~ ^[A-Za-z0-9_]{1,32}$ ]] || { echo "::error::The MySQL user must be letters, digits and _ (at most 32)."; exit 1; }
          [ -z "$RABBITMQ_DOMAIN" ] || [[ "$RABBITMQ_DOMAIN" =~ ^([A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,}$ ]] || { echo "::error::The RabbitMQ domain is not a host name (e.g. rabbitmq.example.com)."; exit 1; }
          [[ "$RABBITMQ_ALLOWED_IPS" =~ ^[0-9A-Fa-f:./,]*$ ]] || { echo "::error::The allowed addresses must be IPs or networks separated by commas."; exit 1; }
          [[ "$HOST$USER$PORT" =~ ^[A-Za-z0-9._@:-]+$ ]] || { echo "::error::The host, user or port has unexpected characters."; exit 1; }
          # this folder is synced with --delete: it must be a folder of its own, two levels deep at least (/opt/infra), never a system folder
          [[ "$INFRA_ROOT" =~ ^/[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+$ ]] || { echo "::error::The infra folder must be an absolute path without spaces, at least two levels deep (e.g. /opt/infra)."; exit 1; }
          case "$INFRA_ROOT" in /usr/*|/etc/*|/var/*|/bin/*|/sbin/*|/lib*|/boot/*|/root/*|/home|/home/) echo "::error::$INFRA_ROOT is a system folder: use a folder of its own such as /opt/infra."; exit 1 ;; esac

      - name: Configure SSH key
        env:
          SECRET_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash scripts/configure-ssh-key.sh

      - name: Render the settings
        run: python3 scripts/render_env.py

      - name: Prepare the server
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          scp -i "$HOME/.ssh/deploy_key" -P "$PORT" -o StrictHostKeyChecking=accept-new scripts/bootstrap-server.sh "$USER@$HOST:/tmp/bootstrap-server.sh"
          $SSH "$USER@$HOST" "INFRA_ROOT='$INFRA_ROOT' bash /tmp/bootstrap-server.sh"

      - name: Upload
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          $SSH "$USER@$HOST" "mkdir -p '$INFRA_ROOT/nginx/sites' '$INFRA_ROOT/certs' '$INFRA_ROOT/letsencrypt' '$INFRA_ROOT/acme-webroot'"
          # the host files and certificates put there by the services' deploys (nginx-route) are never deleted by a sync
          rsync -az --delete --exclude 'nginx/sites/' --exclude 'certs/' --exclude 'letsencrypt/' --exclude 'acme-webroot/' --exclude '.nginx-route.lock' -e "$SSH" infra/ "$USER@$HOST:$INFRA_ROOT/"
          sed "s|__INFRA_DIR__|$INFRA_ROOT|" scripts/nginx-route.sh | $SSH "$USER@$HOST" "cat > /usr/local/bin/nginx-route && chmod 755 /usr/local/bin/nginx-route"

      - name: Start the shared services
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          $SSH "$USER@$HOST" bash -s <<REMOTE
            set -euo pipefail
            cd '$INFRA_ROOT'
            docker network inspect public >/dev/null 2>&1 || docker network create public
            docker compose pull
            docker compose up -d --remove-orphans
            echo "Waiting for MySQL..."
            for i in \$(seq 1 60); do [ "\$(docker inspect -f '{{.State.Health.Status}}' mysql 2>/dev/null)" = healthy ] && break; sleep 3; done
            set -a; . ./.env; set +a
            bash mysql/ensure-user.sh
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload
            echo "Hosts served now:"; nginx-route list || true
            docker compose ps
          REMOTE

      - name: Publish the RabbitMQ management page
        if: env.RABBITMQ_DOMAIN != ''
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          ALLOW_ARGS=""; [ -z "$RABBITMQ_ALLOWED_IPS" ] || ALLOW_ARGS="--allow $RABBITMQ_ALLOWED_IPS"
          # a certificate for the domain is requested from Let's Encrypt by nginx-route (the name must point to this server). A failure here is a warning: the install above is complete.
          if ! $SSH "$USER@$HOST" "nginx-route add --host $RABBITMQ_DOMAIN --target rabbitmq:15672 $ALLOW_ARGS"; then
            echo "::warning::The RabbitMQ page https://$RABBITMQ_DOMAIN was not published (see the message above). Usually the name does not point to this server yet (add its A record) or port 80 is blocked; fix it and run this workflow again."
          fi
          [ -n "$ALLOW_ARGS" ] || echo "::notice::The RabbitMQ page is open to every address; only the RabbitMQ login protects it. Consider rabbitmq_allowed_ips."
