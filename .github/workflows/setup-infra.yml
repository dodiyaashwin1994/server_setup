name: Setup infrastructure

# Installs the shared part of a server once; the apps then publish themselves with `nginx-route` from their own deploy workflow.
#   install       Docker, a firewall that opens SSH/HTTP/HTTPS only, nginx, MySQL, Redis, RabbitMQ, the certificates and the `nginx-route` command. Safe to re-run (a password or setting changed).
#   certificates  Only installs or renews certificates and reloads nginx. Nothing else is touched.
# Host names are not configured here: each app calls `nginx-route add --host app.example.com --target container:port` when it is deployed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: install = the whole shared setup; certificates = only install / renew certificates
        type: choice
        options: [install, certificates]
        default: install
      domains:
        description: "Other domains to install a certificate for, comma separated (SERVICE_DOMAIN is always included)"
        type: string
        default: ""

concurrency:
  group: infra-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT || '/opt/leezify' }}
      HOST: ${{ secrets.SERVER_HOST }}
      USER: ${{ secrets.SERVER_USER || 'root' }}
      PORT: ${{ secrets.SERVER_PORT || '22' }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          SECRET_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash scripts/configure-ssh-key.sh

      - name: Prepare the server
        if: inputs.mode == 'install'
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          scp -i "$HOME/.ssh/deploy_key" -P "$PORT" -o StrictHostKeyChecking=accept-new scripts/bootstrap-server.sh "$USER@$HOST:/tmp/bootstrap-server.sh"
          $SSH "$USER@$HOST" "DEPLOY_ROOT='$DEPLOY_ROOT' bash /tmp/bootstrap-server.sh"

      - name: Render the settings
        if: inputs.mode == 'install'
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/render_env.py

      - name: Render the certificates
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          DOMAINS_INPUT: ${{ inputs.domains }}
        run: python3 scripts/render_certs.py

      - name: Check the certificates
        run: |
          # each must be valid for a while, belong to its key and be a wildcard for its domain (*.domain)
          for dir in infra/certs/*/; do
            base="$(basename "$dir")"; f="$dir/fullchain.pem"
            echo "== $base"
            openssl x509 -in "$f" -noout -subject -enddate
            openssl x509 -in "$f" -noout -checkend 1209600 || { echo "::error::The certificate for $base expires within 14 days (or already has). Install a new one with leezify_env/scripts/set-tls.sh."; exit 1; }
            [ "$(openssl x509 -in "$f" -noout -pubkey | openssl sha256)" = "$(openssl pkey -in "$dir/privkey.pem" -pubout | openssl sha256)" ] || { echo "::error::The private key does not belong to the certificate for $base."; exit 1; }
            names="$(openssl x509 -in "$f" -noout -text | awk '/Subject Alternative Name/ {getline; print}' | tr ',' '\n' | sed -n 's/.*DNS:[[:space:]]*//p' | tr -d ' ' || true)"
            echo "$names" | grep -qx "\*.$base" || { echo "::error::The certificate for $base must be a wildcard (*.$base)."; exit 1; }
          done

      - name: Make sure the shared services are there
        if: inputs.mode == 'certificates'
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          $SSH "$USER@$HOST" "docker ps --format '{{.Names}}' | grep -qx nginx" || { echo "::error::nginx is not running on the server. Run this workflow once with mode = install."; exit 1; }

      - name: Upload
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          $SSH "$USER@$HOST" "mkdir -p '$DEPLOY_ROOT/infra/nginx/sites' '$DEPLOY_ROOT/infra/certs'"
          if [ "$MODE" = install ]; then
            # the host files written by nginx-route (sites/) and the certificates are never deleted by a sync
            rsync -az --delete --exclude 'nginx/sites/' --exclude 'certs/' --exclude '.nginx-route.lock' -e "$SSH" infra/ "$USER@$HOST:$DEPLOY_ROOT/infra/"
            sed "s|__INFRA_DIR__|$DEPLOY_ROOT/infra|" scripts/nginx-route.sh | $SSH "$USER@$HOST" "cat > /usr/local/bin/nginx-route && chmod 755 /usr/local/bin/nginx-route"
          fi
          rsync -az --exclude '.gitkeep' -e "$SSH" infra/certs/ "$USER@$HOST:$DEPLOY_ROOT/infra/certs/"

      - name: Start the shared services
        if: inputs.mode == 'install'
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          $SSH "$USER@$HOST" bash -s <<REMOTE
            set -euo pipefail
            cd '$DEPLOY_ROOT/infra'
            docker network inspect public >/dev/null 2>&1 || docker network create public
            docker compose pull
            docker compose up -d --remove-orphans
          REMOTE

      - name: Test and reload nginx
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          $SSH "$USER@$HOST" bash -s <<REMOTE
            set -euo pipefail
            cd '$DEPLOY_ROOT/infra'
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload
            echo "Hosts served now:"; nginx-route list || true
            docker compose ps
          REMOTE
