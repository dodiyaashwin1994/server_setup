name: Setup infrastructure

# The shared part of a server: Docker, a firewall, the nginx edge, certbot (free Let's Encrypt certificates), MySQL, Redis, RabbitMQ and the `nginx-route` command. Tick what you want
# (re)deployed: a ticked service is pulled and recreated with the current settings; an unticked one is not touched at all. First time on a server: tick prepare_server and everything.
# Everything is asked here, as inputs of the run: nothing is read from secrets or variables of this repository, except the SSH private key (the secret SSH_PRIVATE_KEY of the environment;
# the branch picks it: main, dev, uat). Typed passwords are masked in the logs, but stay visible in the run's inputs to everyone who can read this repository's runs.
# A value left empty keeps the one already in /opt/infra/.env on the server, so redeploying one service does not need every password again.
# Each service publishes its own address when it is deployed (see its workflow); HTTPS certificates are free Let's Encrypt ones that `nginx-route add` requests for each host name.
on:
  workflow_dispatch:
    inputs:
      server_host:
        description: IP address (or host name) of the server
        type: string
        required: true
      ssh_user:
        description: SSH user
        type: string
        default: root
      ssh_port:
        description: SSH port
        type: string
        default: "22"
      infra_root:
        description: Folder of the shared services on the server (the application services go to /opt/saas, see their deploy workflows)
        type: string
        default: /opt/infra
      prepare_server:
        description: "Prepare the server: install Docker if missing, create the network, set the firewall (22, 80, 443), remove old rules that opened database ports. Tick the first time"
        type: boolean
        default: false
      deploy_nginx:
        description: "Deploy / redeploy nginx (the edge). It restarts: a few seconds without HTTPS"
        type: boolean
        default: false
      deploy_certbot:
        description: "Deploy / redeploy certbot (renews the Let's Encrypt certificates)"
        type: boolean
        default: false
      deploy_mysql:
        description: "Deploy / redeploy MySQL (restarts it; data is kept). This also opens the port for mysql_remote_ips, or closes it when that is empty"
        type: boolean
        default: false
      deploy_redis:
        description: "Deploy / redeploy Redis (restarts it)"
        type: boolean
        default: false
      deploy_rabbitmq:
        description: "Deploy / redeploy RabbitMQ (restarts it; its data and users are kept)"
        type: boolean
        default: false
      mysql_username:
        description: "MySQL user the services log in with: root, or another name that is created with every privilege (empty = keep, root if new)"
        type: string
        required: false
      mysql_password:
        description: "MySQL password of that user, also root's (empty = keep). Only set on the very first start of MySQL; see the README"
        type: string
        required: false
      mysql_port:
        description: "Port on the server that leads to MySQL for tools outside (e.g. Workbench). It is only open when mysql_remote_ips is set. Inside the server MySQL stays on 3306"
        type: string
        default: "4567"
      mysql_remote_ips:
        description: "Addresses allowed to connect to MySQL from outside (your public IP, e.g. 203.0.113.7 or 203.0.113.0/24, comma separated). Empty = nobody from outside and the port stays closed"
        type: string
        required: false
      update_mysql_access:
        description: "Only apply mysql_remote_ips to MySQL's accounts, without restarting it (use it when your IP changes). Opening or closing the port itself needs deploy_mysql"
        type: boolean
        default: false
      redis_password:
        description: Redis password (empty = keep)
        type: string
        required: false
      rabbitmq_username:
        description: RabbitMQ user (empty = keep, root if new). Only created on the first start of RabbitMQ
        type: string
        required: false
      rabbitmq_password:
        description: RabbitMQ password (empty = keep)
        type: string
        required: false
      acme_email:
        description: "E-mail address for Let's Encrypt (it writes to it before a certificate expires)"
        type: string
        required: true
        default: dodiyaashwin1994@gmail.com
      acme_staging:
        description: "Use Let's Encrypt's test service (certificates browsers do not trust, no rate limits): to try the first deploys. Leave off for real use"
        type: boolean
        default: false
      rabbitmq_domain:
        description: "Host name of the RabbitMQ management page, e.g. rabbitmq.example.com (empty = not published). Its certificate is requested from Let's Encrypt"
        type: string
        required: false
      rabbitmq_allowed_ips:
        description: "Addresses allowed to open that page, comma separated, e.g. 203.0.113.0/24,198.51.100.7 (empty = everyone who knows the login)"
        type: string
        required: false

concurrency:
  group: infra-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      HOST: ${{ inputs.server_host }}
      USER: ${{ inputs.ssh_user }}
      PORT: ${{ inputs.ssh_port }}
      INFRA_ROOT: ${{ inputs.infra_root }}
      PREPARE_SERVER: ${{ inputs.prepare_server }}
      DEPLOY_NGINX: ${{ inputs.deploy_nginx }}
      DEPLOY_CERTBOT: ${{ inputs.deploy_certbot }}
      DEPLOY_MYSQL: ${{ inputs.deploy_mysql }}
      DEPLOY_REDIS: ${{ inputs.deploy_redis }}
      DEPLOY_RABBITMQ: ${{ inputs.deploy_rabbitmq }}
      MYSQL_USERNAME: ${{ inputs.mysql_username }}
      MYSQL_PASSWORD: ${{ inputs.mysql_password }}
      MYSQL_PORT: ${{ inputs.mysql_port }}
      MYSQL_REMOTE_IPS: ${{ inputs.mysql_remote_ips }}
      UPDATE_MYSQL_ACCESS: ${{ inputs.update_mysql_access }}
      REDIS_PASSWORD: ${{ inputs.redis_password }}
      RABBITMQ_USERNAME: ${{ inputs.rabbitmq_username }}
      RABBITMQ_PASSWORD: ${{ inputs.rabbitmq_password }}
      ACME_EMAIL: ${{ inputs.acme_email }}
      ACME_STAGING: ${{ inputs.acme_staging }}
      RABBITMQ_DOMAIN: ${{ inputs.rabbitmq_domain }}
      RABBITMQ_ALLOWED_IPS: ${{ inputs.rabbitmq_allowed_ips }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the values
        run: |
          # keep typed passwords out of the logs
          for v in MYSQL_PASSWORD REDIS_PASSWORD RABBITMQ_PASSWORD; do [ -z "${!v}" ] || echo "::add-mask::${!v}"; done
          [ -n "$HOST" ] || { echo "::error::Give the server's IP address (input server_host)."; exit 1; }
          [[ "$MYSQL_USERNAME" =~ ^[A-Za-z0-9_]{0,32}$ ]] || { echo "::error::The MySQL user must be letters, digits and _ (at most 32)."; exit 1; }
          [ -z "$RABBITMQ_DOMAIN" ] || [[ "$RABBITMQ_DOMAIN" =~ ^([A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,}$ ]] || { echo "::error::The RabbitMQ domain is not a host name (e.g. rabbitmq.example.com)."; exit 1; }
          [[ "$RABBITMQ_ALLOWED_IPS" =~ ^[0-9A-Fa-f:./,]*$ ]] || { echo "::error::The allowed addresses must be IPs or networks separated by commas."; exit 1; }
          [[ "$HOST$USER$PORT" =~ ^[A-Za-z0-9._@:-]+$ ]] || { echo "::error::The host, user or port has unexpected characters."; exit 1; }
          # this folder is synced with --delete: it must be a folder of its own, two levels deep at least (/opt/infra), never a system folder
          [[ "$INFRA_ROOT" =~ ^/[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+$ ]] || { echo "::error::The infra folder must be an absolute path without spaces, at least two levels deep (e.g. /opt/infra)."; exit 1; }
          case "$INFRA_ROOT" in /usr/*|/etc/*|/var/*|/bin/*|/sbin/*|/lib*|/boot/*|/root/*|/home|/home/) echo "::error::$INFRA_ROOT is a system folder: use a folder of its own such as /opt/infra."; exit 1 ;; esac
          [[ "$MYSQL_PORT" =~ ^[0-9]{4,5}$ ]] || { echo "::error::mysql_port must be a number such as 4567."; exit 1; }
          [ -z "$MYSQL_REMOTE_IPS" ] || [ "$DEPLOY_MYSQL" = true ] || [ "$UPDATE_MYSQL_ACCESS" = true ] || echo "::warning::mysql_remote_ips is only applied when deploy_mysql (or update_mysql_access) is ticked: it is ignored in this run."
          S=""; for v in NGINX CERTBOT MYSQL REDIS RABBITMQ; do n="DEPLOY_$v"; [ "${!n}" != true ] || S="$S $(echo $v | tr A-Z a-z)"; done
          [ "$PREPARE_SERVER" = true ] && echo "Server will be prepared." || true
          echo "Services to (re)deploy:${S:- none (the files and nginx-route are updated only)}"

      - name: Configure SSH key
        env:
          SECRET_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash scripts/configure-ssh-key.sh

      - name: Fetch the settings the server already has
        run: |
          # a value left empty in this run keeps the one the server has (nothing to fetch the first time)
          scp -q -i "$HOME/.ssh/deploy_key" -P "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST:$INFRA_ROOT/.env" infra/.env.server 2>/dev/null && echo "found the server's current settings" || echo "no settings on the server yet"

      - name: Render the settings
        run: python3 scripts/render_env.py

      - name: Prepare the server
        if: inputs.prepare_server
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          scp -i "$HOME/.ssh/deploy_key" -P "$PORT" -o StrictHostKeyChecking=accept-new scripts/bootstrap-server.sh "$USER@$HOST:/tmp/bootstrap-server.sh"
          $SSH "$USER@$HOST" "INFRA_ROOT='$INFRA_ROOT' bash /tmp/bootstrap-server.sh"

      - name: Upload
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          $SSH "$USER@$HOST" "mkdir -p '$INFRA_ROOT/nginx/sites' '$INFRA_ROOT/certs' '$INFRA_ROOT/letsencrypt' '$INFRA_ROOT/acme-webroot'"
          # the host files and certificates (nginx-route, certbot) are never deleted by a sync
          rsync -az --delete --exclude 'nginx/sites/' --exclude 'certs/' --exclude 'letsencrypt/' --exclude 'acme-webroot/' --exclude '.nginx-route.lock' --exclude '.env.server' -e "$SSH" infra/ "$USER@$HOST:$INFRA_ROOT/"
          sed "s|__INFRA_DIR__|$INFRA_ROOT|" scripts/nginx-route.sh | $SSH "$USER@$HOST" "cat > /usr/local/bin/nginx-route && chmod 755 /usr/local/bin/nginx-route"

      - name: Deploy the ticked services
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          SERVICES=""
          for v in NGINX CERTBOT MYSQL REDIS RABBITMQ; do n="DEPLOY_$v"; [ "${!n}" != true ] || SERVICES="$SERVICES $(echo $v | tr A-Z a-z)"; done
          $SSH "$USER@$HOST" bash -s <<REMOTE
            set -euo pipefail
            cd '$INFRA_ROOT'
            docker network inspect public >/dev/null 2>&1 || docker network create public
            if [ -n '$SERVICES' ]; then
              docker compose pull $SERVICES
              docker compose up -d --force-recreate --no-deps $SERVICES
            else
              echo "No service ticked: nothing redeployed."
            fi
            if [ "$DEPLOY_MYSQL" = true ] || [ "$UPDATE_MYSQL_ACCESS" = true ]; then
              echo "Waiting for MySQL..."
              for i in \$(seq 1 60); do [ "\$(docker inspect -f '{{.State.Health.Status}}' mysql 2>/dev/null)" = healthy ] && break; sleep 3; done
              set -a; . ./.env; set +a
              bash mysql/ensure-user.sh
            fi
            if docker ps --format '{{.Names}}' | grep -qx nginx; then
              docker compose exec -T nginx nginx -t
              docker compose exec -T nginx nginx -s reload
            fi
            echo "Hosts served now:"; nginx-route list || true
            docker compose ps
          REMOTE

      - name: Publish the RabbitMQ management page
        if: env.RABBITMQ_DOMAIN != ''
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          ALLOW_ARGS=""; [ -z "$RABBITMQ_ALLOWED_IPS" ] || ALLOW_ARGS="--allow $RABBITMQ_ALLOWED_IPS"
          # a certificate for the domain is requested from Let's Encrypt by nginx-route (the name must point to this server). A failure here is a warning: the install above is complete.
          if ! $SSH "$USER@$HOST" "nginx-route add --host $RABBITMQ_DOMAIN --target rabbitmq:15672 $ALLOW_ARGS"; then
            echo "::warning::The RabbitMQ page https://$RABBITMQ_DOMAIN was not published (see the message above). Usually the name does not point to this server yet (add its A record) or port 80 is blocked, or nginx is not running (tick deploy_nginx); fix it and run this workflow again."
          fi
          [ -n "$ALLOW_ARGS" ] || echo "::notice::The RabbitMQ page is open to every address; only the RabbitMQ login protects it. Consider rabbitmq_allowed_ips."
